summary: "The control-plane UI MUST provide dashboard, host, certificate, access-list, user, access-token, activity, settings, and system-health flows. Access tokens MUST have a first-class routed page rather than a nested modal. The page MUST distinguish self-management from explicitly authorized cross-user administration; support list, issue, one-time secret reveal, rotate, expiry update, and revoke; use product-neutral labels; and represent forbidden, read-only, empty, loading, validation, error, success, and destructive-confirmation states. Browser acceptance MUST operate these controls, not merely visit the page. The broader UI MUST represent saving, pending, activation failure, degraded runtime, certificate risk, and destructive dependency states. Proxy-host rows and details MUST independently expose administrative, deployment, and observed reachability state according to spc:1018. Host inventory MUST distinguish human, automation-managed, and system provenance and display non-empty meta.managed_by values verbatim. Responsive behavior, keyboard operation, focus management, semantic forms and tables, reduced motion, 200 percent zoom, and WCAG 2.2 AA are release requirements."
