body: |-
  Portwyrm SHALL expose authenticated capability discovery and owner-scoped CRUD for QUIC passthrough hosts. The UDP gateway SHALL inspect QUIC v1 and v2 Initial packets only to reassemble ClientHello metadata, select an enabled SNI and ALPN route, preserve encrypted payloads, maintain bounded per-client affinity and queues, expire idle state, remove failed targets, and never terminate TLS. The gateway deployment SHALL be the sole host UDP/443 publisher; application Compose stacks SHALL expose container UDP ports without host mappings.
