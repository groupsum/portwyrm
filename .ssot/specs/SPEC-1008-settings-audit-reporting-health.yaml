body: |-
  The product MUST expose NPM-compatible settings and audit endpoints plus native liveness, readiness, database, reconciliation, Nginx, certificate scheduler, proxy-host observation, and degraded-state health. Authenticated system status MUST report live Nginx counters and the content-addressed active configuration generation; unavailable telemetry MUST not be fabricated. Audit MUST cover authentication, token, permission, secret, certificate, resource mutation, activation, and rollback events while redacting passwords, bearer tokens, provider credentials, TOTP seeds, and private keys. Every authenticated mutation MUST record the stable actor principal identifier and available display identity. Cross-user administration MUST also record the target principal. Delete events MUST retain a redacted resource snapshot sufficient to prove what was removed. System attribution is valid only when no authenticated principal caused the operation. Token issue, rotate, revoke, permission change, and authentication success or failure outcomes MUST be distinguishable without exposing credentials. Recurring health probes MUST not create mutation-audit noise; activity is emitted only for meaningful health transitions. Reports MUST distinguish desired, validated, applied, and externally observed state.
