body: |-
  Native access tokens SHALL belong to exactly one user principal. A user may manage only that user's tokens; cross-user administration requires an explicit access-token management permission, a distinct authorized operation, and attributed audit. Effective authority SHALL be the intersection of current principal permissions and visibility, token scopes, and endpoint policy; explicit denial wins and unknown scopes fail closed. Authentication SHALL resolve current principal state. Disabled or deleted principals invalidate passwords, sessions, and tokens immediately, while forced-password-change principals are restricted to credential-recovery operations. Expired, revoked, rotated, malformed, or unknown tokens fail uniformly. Rotation SHALL atomically issue a successor and revoke its predecessor. Last-used recording SHALL be bounded so authentication does not require an unbounded write per request. Service-principal credentials are outside the current access-token feature and require a separate decision.
