body: |-
  Compatibility profiles SHALL define exact route and method capabilities, collection and token envelopes, defaults, coercion, unknown-field preservation, status and error shapes, gzip, CORS, no-store, security headers, and retry-safe behavior. Native APIs SHALL remain separately versioned. Across native APIs, invalid, malformed, unknown, expired, revoked, or rotated credentials SHALL return a non-disclosing 401 response. A valid credential lacking effective scope, permission, visibility, ownership, or administrative authority SHALL return 403. Unknown scopes fail closed. Missing or invalid CSRF protection on cookie-authenticated mutations SHALL return 403. Token ownership violations and cross-user administration failures SHALL not disclose the existence or secret state of another principal's credential. Proxy-host probe operations and observed-health fields SHALL remain native extensions unless a frozen compatibility profile explicitly includes them; compatibility payloads SHALL not drift implicitly.
