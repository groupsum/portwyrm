summary: "Memory, SQLite, MySQL/MariaDB, PostgreSQL, filesystem-only, and hybrid adapters MUST satisfy one repository conformance suite. Durable adapters MUST preserve transactions, portable identifiers, relationships, metadata, audit ordering, outbox behavior, and secret references. Identity conformance MUST execute real principal registration, password authentication, PAT insertion, verification, rotation, revocation, expiry, and application reconstruction against every supported durable database. Generated PAT identifiers MUST be representable by the declared column type on every backend; numeric-range assertions alone do not satisfy PostgreSQL or MySQL conformance. Filesystem-only mode is single-writer. PostgreSQL MAY provide HA through row locks and advisory leases. Cross-backend movement MUST use a versioned checksummed export, validation, dry-run import, and reconciliation."
