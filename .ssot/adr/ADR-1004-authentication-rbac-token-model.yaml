summary: "NPM compatibility requires JWT, user visibility, section permissions, and TOTP while operators also require revocable automation credentials. Portwyrm SHALL preserve compatible JWT, RBAC, and 2FA behavior and add separately scoped opaque personal access tokens stored only as hashes. The current native access-token feature is limited to user-principal-owned PATs; service-principal credentials require a separate feature and decision. Native PAT semantics SHALL follow adr:1018, standalone package and persistence ownership SHALL follow adr:1019, native tokens SHALL NOT alter compatibility JWT semantics, and every credential or privilege transition SHALL be attributed and audited."
