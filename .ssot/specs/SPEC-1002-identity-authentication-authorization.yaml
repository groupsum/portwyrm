body: |-
  The control plane MUST preserve NPM-compatible users, administrators, disabled state, password lifecycle, section permissions hidden/view/manage, visibility user/all, RS256 JWT issuance and refresh, TOTP challenge, and eight one-use backup codes. Native access tokens are user-principal-owned PATs; service-principal credentials are outside this feature. PATs MUST be opaque, scoped, expiring, revocable, shown once, hashed at rest, and audited. Effective authority MUST be the fail-closed intersection of current principal permissions and visibility, PAT scopes, and endpoint policy; explicit denial wins and unknown scopes deny access. Users may manage only their own PATs. Cross-user administration requires an explicit access-token management permission and attributed operation. Disabled or deleted principals invalidate password, session, and PAT authentication immediately. Forced-password-change principals may access only credential-recovery operations. Expired, revoked, rotated, malformed, or unknown credentials MUST fail uniformly. Rotation MUST atomically revoke the predecessor and issue the successor. Last-used recording MUST be bounded. UI sessions MUST be expiring and revocable, use secure HttpOnly SameSite cookies, and require CSRF protection for mutations.
