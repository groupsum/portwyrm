name: Deploy QUIC gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portwyrm-quic-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: deployment
    environment: deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5

      - name: Validate host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect dockerwp >/dev/null
          if docker ps --format '{{.Ports}}' | grep -Eq '0\.0\.0\.0:443->.*/udp|\[::\]:443->.*/udp'; then
            owner="$(docker ps --filter publish=443/udp --format '{{.Names}}' | head -n 1)"
            if [[ "$owner" != "portwyrm-quic-gateway" ]]; then
              echo "UDP/443 is already published by $owner" >&2
              exit 1
            fi
          fi

      - uses: cobycloud/actions/actions/docker-compose-stack@e94aa20f4de0d91be54af581433857333d52124e # reviewed master 2026-07-25
        with:
          compose-file: compose.quic-gateway.yaml
          project-name: portwyrm-quic-gateway
          operation: deploy

      - name: Verify control and QUIC data planes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' portwyrm-quic-gateway 2>/dev/null || true)"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' portwyrm-quic-gateway)" = healthy
          docker exec portwyrm-quic-gateway python /app/deploy/rotate-bootstrap-admin.py
          docker exec portwyrm-quic-gateway \
            python -c "import json,pathlib; data=json.loads(pathlib.Path('/data/deployment-admin.json').read_text()); assert data['email']; assert len(data['password']) >= 36"
          docker exec portwyrm-quic-gateway \
            python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:81/api/v2/capabilities')); assert data['quic_sni_passthrough']['supported'] is True; assert data['quic_sni_passthrough']['tls_termination'] is False"
          docker inspect --format '{{json .NetworkSettings.Ports}}' portwyrm-quic-gateway \
            | grep -Fq '443/udp'

      - if: always()
        uses: cobycloud/actions/actions/docker-compose-stack@e94aa20f4de0d91be54af581433857333d52124e # reviewed master 2026-07-25
        with:
          compose-file: compose.quic-gateway.yaml
          project-name: portwyrm-quic-gateway
          operation: logs
          logs-output: quic-gateway-production.log

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: quic-gateway-deploy-${{ github.sha }}
          path: quic-gateway-production.log
          if-no-files-found: warn
          retention-days: 14
