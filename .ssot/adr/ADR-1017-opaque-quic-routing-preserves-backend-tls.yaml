body: |-
  Context: Nginx Proxy Manager cannot select UDP QUIC flows by hostname and must not terminate application WebTransport sessions. Decision: Portwyrm owns host UDP/443 in a separate gateway, inspects only QUIC Initial SNI and ALPN, and forwards the encrypted flow to one configured Docker or UDP target. The backend owns TLS, certificate presentation, HTTP/3, and WebTransport. Consequences: NPM remains on TCP/443; unknown SNI, unsupported ALPN, malformed Initial packets, and direct-IP traffic are not routed; each hostname has an independent destination.
