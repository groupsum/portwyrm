body: |-
  Portwyrm SHALL compose focused standalone Tigrbl Auth contracts and providers directly and SHALL NOT depend on an authentication or credentials facade. Portwyrm SHALL retain ownership of its portable personal-access-token table until standalone authentication storage supports Portwyrm's engine-neutral schema, identifier constraints, component migration, and adoption requirements. New PAT secrets SHALL use domain-separated SHA-256 normalization before the standalone bcrypt provider; existing Argon2 PAT digests SHALL remain verification-compatible through an explicitly tested retirement window. The current commit-pinned Git dependency closure is a temporary distribution exception caused by incomplete or inconsistent registry artifacts. Migration to released standalone packages requires import-surface, class-identity, lock-resolution, and persistence-conformance evidence.
