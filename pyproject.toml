[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "portwyrm"
version = "0.1.0a14"
description = "A self-hosted, npmctl-compatible reverse proxy control plane and UI."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Groupsum" }]
dependencies = [
  "argon2-cffi>=25.1,<26",
  "bcrypt>=4,<6",
  "cryptography>=50.0.0,<51",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "pyotp>=2.9,<3",
  "sqlalchemy>=2.0.51,<3",
  # The standalone auth packages are source-pinned together because their
  # current registry artifacts are incomplete/internally inconsistent.
  "tigrbl-attestation-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-attestation-contracts",
  "tigrbl-claim-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-claim-contracts",
  "tigrbl-did-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-did-contracts",
  "tigrbl-digital-credential-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-digital-credential-contracts",
  "tigrbl-identity-assurance-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-identity-assurance-contracts",
  "tigrbl-identity-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-identity-contracts",
  "tigrbl-identity-core @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/00-primitives/tigrbl-identity-core",
  "tigrbl-public-key-authentication-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-public-key-authentication-contracts",
  "tigrbl-replay-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-replay-contracts",
  "tigrbl-security-event-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-security-event-contracts",
  "tigrbl-security-trust-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-security-trust-contracts",
  "tigrbl-secret-hashing-bcrypt-provider @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/20-providers/tigrbl-secret-hashing-bcrypt-provider",
  "tigrbl-token-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-token-contracts",
  "tigrbl-workload-identity-contracts @ git+https://github.com/tigrbl/tigrbl_auth.git@fab4fc93d161c5d1d41f1afebf9306dec0e46578#subdirectory=pkgs/02-contracts/tigrbl-workload-identity-contracts",
  "tigrbl[postgres]>=0.4.4,<0.5",
  "uvicorn>=0.35,<1",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/groupsum/portwyrm"
Repository = "https://github.com/groupsum/portwyrm"
Issues = "https://github.com/groupsum/portwyrm/issues"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "ssot-registry>=0.2.26,<0.3",
  "websockets>=15,<16",
]

[project.scripts]
portwyrm = "portwyrm.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"portwyrm.uix" = ["static/*.html", "static/*.css", "static/*.js", "static/*.png", "static/*.ico", "static/assets/*.css", "static/assets/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
